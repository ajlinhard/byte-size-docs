AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Demo stack - S3 bucket that triggers a Lambda on object upload.
  Deployable to dev or prod from the same template.

# ---------------------------------------------------------------------------
# PARAMETERS  (Terraform: variable blocks)
# Supplied at deploy time via --parameter-overrides
# ---------------------------------------------------------------------------
Parameters:

  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: Which environment this stack represents.

  AppName:
    Type: String
    Default: fileproc
    AllowedPattern: '^[a-z][a-z0-9-]{2,20}$'
    ConstraintDescription: Lowercase letters, numbers and hyphens only.
    Description: Short name used as a prefix for all physical resource names.

  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional. Email for prod error alarms. Ignored in dev.

# ---------------------------------------------------------------------------
# MAPPINGS  (Terraform: a locals map keyed by environment)
# Static lookup table. Keys must be literals - no functions allowed in here.
# ---------------------------------------------------------------------------
Mappings:

  EnvConfig:
    dev:
      MemorySize: 128
      Timeout: 10
      LogRetentionDays: 7
      BucketVersioning: Suspended
      LogLevel: DEBUG
    prod:
      MemorySize: 512
      Timeout: 30
      LogRetentionDays: 90
      BucketVersioning: Enabled
      LogLevel: INFO

# ---------------------------------------------------------------------------
# CONDITIONS  (Terraform: count = var.x ? 1 : 0, but first-class)
# Declared once, then usable as a resource attribute OR inline via !If
# ---------------------------------------------------------------------------
Conditions:

  IsProd: !Equals [!Ref Environment, prod]

  # Conditions can be composed from other conditions
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  CreateAlarmTarget: !And [!Condition IsProd, !Condition HasAlarmEmail]

Resources:

  # -------------------------------------------------------------------------
  # S3 BUCKET
  #
  # The bucket name is fully deterministic. That matters: several resources
  # below need the bucket ARN, and if they got it with !GetAtt they would
  # create a dependency cycle (bucket -> function -> role -> bucket).
  # Because we know the name, we can build the ARN as a string instead.
  # -------------------------------------------------------------------------
  UploadBucket:
    Type: AWS::S3::Bucket
    # Terraform equivalent: lifecycle { prevent_destroy = true }
    # Applies to both environments here. If you'd rather dev buckets be
    # disposable, deploy dev from a copy of this template without these,
    # or empty + delete the bucket manually after stack deletion.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # Explicit ordering: the notification config below cannot be applied
    # until S3 has permission to invoke the function.
    DependsOn: InvokePermission
    Properties:
      BucketName: !Sub '${AppName}-uploads-${Environment}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: !FindInMap [EnvConfig, !Ref Environment, BucketVersioning]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Function: !GetAtt ProcessorFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: incoming/
      LifecycleConfiguration:
        Rules:
          # !If inside a property value. AWS::NoValue removes the key
          # entirely - this is how you express "omit this field".
          - Id: ExpireOldVersions
            Status: !If [IsProd, Enabled, Disabled]
            NoncurrentVersionExpirationInDays: 30

  # -------------------------------------------------------------------------
  # IAM ROLE for the Lambda
  # -------------------------------------------------------------------------
  ProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: ReadUploads
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                # NOTE: string-built ARN, not !GetAtt UploadBucket.Arn.
                # Using !GetAtt here would create a circular dependency.
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AppName}-uploads-${Environment}-${AWS::AccountId}/*'

  # -------------------------------------------------------------------------
  # LOG GROUP
  # Created explicitly so retention is managed as code. If you let Lambda
  # create it implicitly, retention defaults to Never Expire forever.
  # -------------------------------------------------------------------------
  ProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AppName}-processor-${Environment}'
      RetentionInDays: !FindInMap [EnvConfig, !Ref Environment, LogRetentionDays]

  # -------------------------------------------------------------------------
  # LAMBDA FUNCTION
  # Inline code keeps this example self-contained. Real deployments point
  # Code at an S3 object (or use SAM to package it for you).
  # -------------------------------------------------------------------------
  ProcessorFunction:
    Type: AWS::Lambda::Function
    DependsOn: ProcessorLogGroup
    Properties:
      FunctionName: !Sub '${AppName}-processor-${Environment}'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ProcessorRole.Arn
      MemorySize: !FindInMap [EnvConfig, !Ref Environment, MemorySize]
      Timeout: !FindInMap [EnvConfig, !Ref Environment, Timeout]
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !FindInMap [EnvConfig, !Ref Environment, LogLevel]
      Code:
        ZipFile: |
          import json, logging, os, urllib.parse

          logger = logging.getLogger()
          logger.setLevel(os.environ.get("LOG_LEVEL", "INFO"))

          def handler(event, context):
              for record in event.get("Records", []):
                  bucket = record["s3"]["bucket"]["name"]
                  key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])
                  size = record["s3"]["object"].get("size", 0)
                  logger.info("env=%s bucket=%s key=%s size=%s",
                              os.environ["ENVIRONMENT"], bucket, key, size)
              return {"statusCode": 200, "body": json.dumps("ok")}

  # -------------------------------------------------------------------------
  # PERMISSION - lets S3 invoke the function.
  # Again: SourceArn is a built string, not !GetAtt, to break the cycle.
  # -------------------------------------------------------------------------
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ProcessorFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${AppName}-uploads-${Environment}-${AWS::AccountId}'

  # -------------------------------------------------------------------------
  # PROD-ONLY RESOURCES
  # The Condition attribute removes these from the stack entirely in dev.
  # -------------------------------------------------------------------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: IsProd
    Properties:
      TopicName: !Sub '${AppName}-alarms-${Environment}'

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: CreateAlarmTarget
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: !Sub '${AppName}-processor-errors-${Environment}'
      AlarmDescription: Lambda errors detected in production.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

# ---------------------------------------------------------------------------
# OUTPUTS  (Terraform: output blocks)
# Export makes a value importable by other stacks in the same account+region.
# Warning: an exported value cannot be changed or deleted while any stack
# imports it. Prefix export names with the stack name to keep them unique.
# ---------------------------------------------------------------------------
Outputs:

  BucketName:
    Description: Name of the upload bucket.
    Value: !Ref UploadBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  BucketArn:
    Description: ARN of the upload bucket.
    Value: !GetAtt UploadBucket.Arn

  FunctionArn:
    Description: ARN of the processor Lambda.
    Value: !GetAtt ProcessorFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FunctionArn'

  AlarmTopicArn:
    Description: SNS topic for alarms. Only present in prod.
    Condition: IsProd
    Value: !Ref AlarmTopic
